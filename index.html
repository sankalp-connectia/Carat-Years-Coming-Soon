<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Carat Years – Sparkling Soon</title>
<meta name="description" content="Carat Years is sparkling soon. Stay tuned."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#b8922a;--gold-dim:rgba(184,146,42,.18);
  --bg:#f9f7f4;--text:#2c2318;--muted:#9a8a74;
}
html,body{
  width:100%;height:100%;
  background:var(--bg);
  font-family:'Cormorant Garamond',Georgia,serif;
  color:var(--text);
  overflow:hidden;
}

/* ══ LAYOUT ══ */
.page{
  display:grid;
  grid-template-columns:1fr 1fr;
  width:100vw;height:100vh;
}

/* ══ LEFT ══ */
.left{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:32px 48px 60px;
  position:relative;background:var(--bg);
  opacity:0;animation:slideLeft .95s cubic-bezier(.22,1,.36,1) .1s forwards;
}
.corner-tl,.corner-br{
  position:absolute;width:30px;height:30px;
  border-color:var(--gold-dim);border-style:solid;
}
.corner-tl{top:28px;left:28px;border-width:1px 0 0 1px}
.corner-br{bottom:28px;right:28px;border-width:0 1px 1px 0}

.eyebrow{
  font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold);margin-bottom:20px;font-weight:400;
  opacity:0;animation:fadeUp .7s ease .7s forwards;
}

/* BRAND NAME — biggest element */
.brand-name{
  font-size:clamp(32px, 4vw, 52px);
  font-weight:600;letter-spacing:.1em;line-height:1;
  color:var(--text);margin-bottom:6px;
  opacity:0;animation:fadeUp .7s ease .85s forwards;
}
.brand-tagline{
  font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--muted);margin-bottom:28px;
  opacity:0;animation:fadeUp .7s ease .95s forwards;
}

/* ── Headline ── */
.headline{
  font-style:italic;font-weight:300;
  line-height:1.2;margin-bottom:6px;
  opacity:0;animation:fadeUp .8s ease 1.05s forwards;
  /* fixed font so word-swap never causes reflow */
  font-size:clamp(28px, 3.2vw, 48px);
}
.headline em{color:var(--gold);font-style:italic}

/* ── Word swap — key fix: wide enough for longest word ── */
.word-swap{
  display:inline-block;
  position:relative;
  /* wide enough for "Sustainable" at any size */
  width:clamp(140px, 14vw, 210px);
  height:1.25em;
  overflow:hidden;
  vertical-align:middle;
}
.word-swap span{
  display:block;
  position:absolute;
  left:0;right:0;text-align:center;
  opacity:0;transform:translateY(80%);
}
.word-swap span.active{animation:wordIn .55s cubic-bezier(.22,1,.36,1) forwards}
.word-swap span.exit {animation:wordOut .4s cubic-bezier(.55,0,1,.45) forwards}

@keyframes wordIn{
  from{opacity:0;transform:translateY(80%)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes wordOut{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-80%)}
}

.headline-suffix{
  display:block;
  font-size:clamp(28px, 3.2vw, 48px);
  font-style:italic;font-weight:300;
  color:var(--text);
  opacity:0;animation:fadeUp .7s ease 1.2s forwards;
  margin-bottom:20px;
}

.rule{
  width:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:0 auto 18px;
  animation:expandRule .9s ease 1.35s forwards;
}
@keyframes expandRule{to{width:60px}}

.body-copy{
  font-size:clamp(14px, 1.4vw, 17px);
  font-weight:300;line-height:1.8;color:var(--muted);
  max-width:280px;margin-bottom:6px;
  opacity:0;animation:fadeUp .7s ease 1.4s forwards;
}
.body-cta{
  font-size:clamp(13px,1.2vw,15px);
  font-weight:400;font-style:italic;
  color:var(--gold);margin-bottom:22px;
  letter-spacing:.04em;
  opacity:0;animation:fadeUp .6s ease 1.55s forwards;
}

/* ── Notify Me — aesthetic ── */
.notify-wrap{
  width:100%;max-width:290px;
  margin-bottom:22px;
  opacity:0;animation:fadeUp .7s ease 1.65s forwards;
}
.notify-label{
  font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;display:block;
}
.notify-field{
  display:flex;align-items:center;
  background:#fff;
  border:1px solid rgba(184,146,42,.35);
  border-radius:50px;
  overflow:hidden;
  box-shadow:0 2px 16px rgba(44,35,24,.06),inset 0 1px 3px rgba(255,255,255,.8);
  transition:border-color .3s,box-shadow .3s;
}
.notify-field:focus-within{
  border-color:var(--gold);
  box-shadow:0 4px 24px rgba(184,146,42,.16),inset 0 1px 3px rgba(255,255,255,.8);
}
.notify-field input{
  flex:1;min-width:0;
  border:none;outline:none;background:transparent;
  padding:11px 16px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:14px;font-weight:300;color:var(--text);
}
.notify-field input::placeholder{color:var(--muted);opacity:.7}
.notify-btn{
  flex-shrink:0;margin:4px;
  padding:8px 18px;
  background:linear-gradient(135deg,#c9a84c,#b8922a);
  border:none;cursor:pointer;border-radius:50px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;
  transition:opacity .25s,transform .2s;
  white-space:nowrap;
}
.notify-btn:hover{opacity:.88;transform:scale(1.04)}
.notify-btn:active{transform:scale(.97)}

.notify-success{
  display:none;
  align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:50px;
  background:rgba(184,146,42,.07);
  border:1px solid rgba(184,146,42,.28);
  font-size:13px;letter-spacing:.05em;
  color:var(--gold);
  animation:fadeUp .5s ease forwards;
}

/* ── Social icons ── */
.social-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-bottom:22px;
  opacity:0;animation:fadeUp .6s ease 1.8s forwards;
}
.social-row a{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--gold-dim);color:var(--muted);
  text-decoration:none;
  transition:border-color .3s,color .3s,background .3s,transform .3s;
}
.social-row a:hover{
  border-color:var(--gold);color:var(--gold);
  background:rgba(184,146,42,.07);
  transform:translateY(-3px);
}
.social-row svg{width:14px;height:14px;fill:currentColor}

.status-row{
  display:flex;align-items:center;justify-content:center;gap:10px;
  opacity:0;animation:fadeUp .6s ease 1.95s forwards;
}
.dot{
  width:5px;height:5px;background:var(--gold);
  transform:rotate(45deg) scale(0);
  animation:popDot .5s cubic-bezier(.34,1.56,.64,1) forwards;
}
.dot:nth-child(1){animation-delay:2.0s}
.dot:nth-child(2){animation-delay:2.2s;opacity:.5}
.dot:nth-child(3){animation-delay:2.4s;opacity:.28}
.status-label{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* ══ RIGHT ══ */
.right{
  display:flex;align-items:center;justify-content:center;
  padding:36px 40px 36px 24px;
  background:var(--bg);
  opacity:0;animation:slideRight .95s cubic-bezier(.22,1,.36,1) .2s forwards;
}
.img-wrap{
  position:relative;height:100%;aspect-ratio:4/5;max-width:100%;
  border-radius:16px;overflow:hidden;
  box-shadow:0 8px 40px rgba(44,35,24,.13),0 2px 12px rgba(44,35,24,.07);
  transition:transform .65s cubic-bezier(.22,1,.36,1),box-shadow .65s cubic-bezier(.22,1,.36,1);
}
.img-wrap:hover{
  transform:translateY(-8px) scale(1.015);
  box-shadow:0 20px 60px rgba(44,35,24,.16),0 4px 18px rgba(44,35,24,.09);
}
.img-wrap img{
  width:100%;height:100%;
  object-fit:cover;object-position:center center;display:block;
  transform:scale(1.05);
  animation:imgSettle 1.5s cubic-bezier(.22,1,.36,1) .3s forwards;
  transition:transform 9s ease;
}
.img-wrap:hover img{transform:scale(1.04)}
@keyframes imgSettle{
  from{transform:scale(1.05) translateY(8px);filter:brightness(.95)}
  to{transform:scale(1) translateY(0);filter:brightness(1)}
}

/* ── Keyframes ── */
@keyframes slideLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popDot{from{transform:rotate(45deg) scale(0)}to{transform:rotate(45deg) scale(1)}}

/* ══ RESPONSIVE ══ */

/* Tablet landscape */
@media(max-width:1100px){
  .left{padding:28px 36px 52px}
  .brand-name{font-size:clamp(28px,3.6vw,44px)}
}

/* Tablet portrait + mobile — stack vertically */
@media(max-width:800px){
  html,body{overflow:auto}
  .page{
    grid-template-columns:1fr;
    grid-template-rows:auto auto;
    height:auto;min-height:100vh;
  }
  .right{
    order:1;
    padding:28px 32px 16px;
    height:auto;
  }
  .img-wrap{
    height:auto;width:78%;
    aspect-ratio:4/5;
    max-width:340px;
    margin:0 auto;
  }
  .left{
    order:2;
    padding:28px 32px 48px;
  }
  .brand-name{font-size:clamp(30px,7vw,44px)}
  .headline,.headline-suffix{font-size:clamp(24px,6vw,38px)}
  .word-swap{width:clamp(120px,30vw,190px);height:1.3em}
  .notify-wrap{max-width:100%}
  .body-copy{max-width:100%}
}

/* Mobile */
@media(max-width:500px){
  .right{padding:24px 20px 12px}
  .img-wrap{width:88%}
  .left{padding:24px 20px 44px}
  .brand-name{font-size:clamp(28px,8vw,40px)}
  .headline,.headline-suffix{font-size:clamp(22px,7vw,34px)}
  .word-swap{width:clamp(110px,32vw,170px)}
  .notify-field input{font-size:13px;padding:10px 14px}
  .notify-btn{font-size:10px;padding:7px 14px}
}

/* Very small screens */
@media(max-width:360px){
  .brand-name{font-size:26px}
  .headline,.headline-suffix{font-size:20px}
  .word-swap{width:130px}
}
</style>
</head>
<body>
<div class="page">

  <section class="left">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <p class="eyebrow">Exquisite Fine Jewellery</p>

    <!-- Brand — biggest font -->
    <div class="brand-name">CARAT YEARS</div>
    <div class="brand-tagline">Celebrate Your Story</div>

    <!-- Headline with cycling word — "is coming." on its own line below -->
    <h1 class="headline">
      Something&nbsp;<em><span class="word-swap" id="wordSwap"><span>Fresh</span></span></em>
    </h1>
    <span class="headline-suffix">is coming.</span>

    <div class="rule"></div>

    <p class="body-copy">
      We are putting the final touches on an experience as refined as our stones.
    </p>
    <p class="body-cta">Be the first to know.</p>

    <!-- Notify Me -->
    <div class="notify-wrap">
      <span class="notify-label">Stay in the loop</span>
      <div class="notify-field" id="notifyField">
        <input type="email" placeholder="your@email.com" id="notifyEmail" autocomplete="email"/>
        <button class="notify-btn" onclick="handleNotify()">Notify Me</button>
      </div>
      <div class="notify-success" id="notifySuccess">
        ✦ &nbsp;You're on the list!
      </div>
    </div>

    <!-- Social -->
    <div class="social-row">
      <a href="https://www.instagram.com/caratyears/" target="_blank" rel="noopener" aria-label="Instagram">

      </a>
      <a href="https://www.facebook.com/share/18r1H9LFvf/?mibextend=wwXIfr" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>

      <a href="https://www.linkedin.com/company/caratyears" target="_blank" rel="noopener" aria-label="LinkedIn">

      </a>
    </div>

    <div class="status-row">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <span class="status-label">Sparkling Soon</span>
    </div>
  </section>

  <div class="right">
    <div class="img-wrap">
      <img
        src="https://res.cloudinary.com/dmfnuqo84/image/upload/v1777960073/Coming_Soon_wqewip.jpg"
        alt="Carat Years diamonds – Sparkling Soon"
        loading="eager"
        fetchpriority="high"
        draggable="false"
      />
    </div>
  </div>

</div>

<script>
  // ── Cycling words ──
  const words = ['Fresh', 'Luxurious', 'Sustainable', 'Stylish', 'Modern'];
  const container = document.getElementById('wordSwap');
  let current = 0;

  // activate first word
  container.querySelector('span').classList.add('active');

  setInterval(() => {
    const next = (current + 1) % words.length;
    const old = container.querySelector('span.active');

    old.classList.remove('active');
    old.classList.add('exit');
    setTimeout(() => old.remove(), 400);

    const el = document.createElement('span');
    el.textContent = words[next];
    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('active'));

    current = next;
  }, 2800);

  // ── Notify Me ──
  function handleNotify() {
    const input  = document.getElementById('notifyEmail');
    const field  = document.getElementById('notifyField');
    const success = document.getElementById('notifySuccess');
    const email  = input.value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      field.style.borderColor = '#c0392b';
      field.style.boxShadow   = '0 0 0 3px rgba(192,57,43,.1)';
      input.focus();
      setTimeout(() => {
        field.style.borderColor = 'rgba(184,146,42,.35)';
        field.style.boxShadow   = '';
      }, 1800);
      return;
    }
    field.style.display   = 'none';
    success.style.display = 'flex';
  }
</script>
</body>
